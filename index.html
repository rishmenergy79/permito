function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
function el(id){return document.getElementById(id);}
function today(){return new Date().toISOString().slice(0,10);}
function fmtDate(d){if(!d)return "—";var p=String(d).slice(0,10).split("-");return p.length===3?p[2]+"."+p[1]+"."+p[0]:String(d);}
function daysTo(d){if(!d)return null;var t=dnum(d);if(isNaN(t))return null;return Math.round((t-dnum(today()))/86400000);}
function numloc(v){if(v===""||v==null)return"";var n=Number(v);return isNaN(n)?String(v):n.toLocaleString("he-IL");}
function dnum(v){if(!v)return NaN;v=String(v).trim();var m=v.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return Date.UTC(+m[1],+m[2]-1,+m[3]);m=v.match(/^(\d{1,2})[.\/](\d{1,2})[.\/](\d{2,4})/);if(m){var y=+m[3];if(y<100)y+=2000;return Date.UTC(y,+m[2]-1,+m[1]);}var t=Date.parse(v);return isNaN(t)?NaN:t;}
function canWrite(){return me.role==="editor"||me.role==="master";}
function toast(m){var t=el("toast");if(!t){t=document.createElement("div");t.id="toast";t.className="toast";document.body.appendChild(t);}t.textContent=m;t.hidden=false;if(toastTimer)clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.hidden=true;},3400);}
function ordered(obj,tpl){var out=[],i,seen={};obj=obj||{};for(i=0;i<tpl.length;i++){var k=(tpl===STAGE_TPL?"s":"d")+(i+1),o=obj[k]||{};seen[k]=1;out.push([k,o,tpl[i],i+1]);}var ex=[];for(var kk in obj){if(!seen[kk]&&obj[kk])ex.push([kk,obj[kk],obj[kk].label||obj[kk].title||"",obj[kk].order||99]);}ex.sort(function(a,b){return a[3]-b[3];});return out.concat(ex);}
function stages(p){return ordered(p.stages,STAGE_TPL).map(function(x){var o=x[1];return [x[0],{label:o.label||x[2],status:o.status||"not_started",date:o.date||"",note:o.note||"",order:x[3]}];});}
function docs(p){return ordered(p.docs,DOC_TPL).map(function(x){var o=x[1];return [x[0],{title:o.title||x[2],status:o.status||"unknown",responsible:o.responsible||"",due:o.due||"",order:x[3]}];});}
function contacts(p){var o=p.contacts||{},out=[];for(var k in o){if(o[k]&&o[k].name)out.push([k,o[k]]);}out.sort(function(a,b){return (a[1].order||0)-(b[1].order||0);});return out;}
function curStage(p){var st=stages(p),i,last=null;for(i=0;i<st.length;i++)if(st[i][1].status==="blocked")return st[i];for(i=0;i<st.length;i++){if(st[i][1].status==="in_progress")return st[i];if(st[i][1].status==="done")last=i;}if(last!=null&&last+1<st.length)return st[last+1];return last!=null?st[last]:st[0];}
function progress(p){var st=stages(p),d=0;st.forEach(function(x){if(x[1].status==="done")d++;});return {done:d,total:st.length};}
function missing(p){var n=0;docs(p).forEach(function(x){if(x[1].status==="missing")n++;});return n;}
function complete(p){var st=stages(p);return st.length&&st[st.length-1][1].status==="done";}
function projStatus(p){var cs=curStage(p),pr=progress(p);
  if(complete(p))return {c:"p-done",l:"הושלם"};
  if(cs&&cs[1].status==="blocked")return {c:"p-bad",l:"תקוע"};
  if(cs&&cs[1].status==="in_progress")return {c:"p-live",l:"בתהליך"};
  if(pr.done>0)return {c:"p-live",l:"בתהליך"};
  return {c:"p-idle",l:"לא התחיל"};}
function pendingFor(id){return tasks.filter(function(t){return t.order_no===id&&t.status!=="done";}).length;}
function stateOf(p){return STATE_ST[p.state]?p.state:"active";}
function uid(p){return p+Math.random().toString(36).slice(2,9);}

function afterLogin(){
  renderLoading("מאמת הרשאות…");
  sb.auth.getUser().then(function(r){
    var u=r.data.user; if(!u){ renderLogin(); return; }
    me.id=u.id; me.email=u.email;
    sb.rpc("ensure_profile").then(function(rp){
      var rpErr=(rp&&rp.error)?rp.error.message:"";
      sb.from("profiles").select("role,full_name,active,must_set_password").eq("id",u.id).maybeSingle().then(function(res){
        if(res.error){ renderDiag(res.error.message, rpErr, "profiles-select"); return; }
        if(!res.data){ renderDiag("הפרופיל לא הוחזר מה-API (0 שורות)", rpErr, "RLS/schema"); return; }
        me.role=res.data.active===false?"pending":(res.data.role||"pending"); me.name=res.data.full_name||u.email;
        if(_recovery||res.data.must_set_password){ renderSetPassword(); return; }
        if(me.role==="pending") renderPending();
        else startApp();
      });
    });
  }).catch(function(e){ renderDiag(String(e&&e.message||e),"","getUser"); });
}

/* קישור ישיר מ-PERMITO J: #open=<מספר הזמנה>&task=<מזהה> */
function handleDeepLink(){
  var h=(location.hash||"").replace(/^#/,""),o={};h.split("&").forEach(function(kv){var i=kv.indexOf("=");if(i>0)o[kv.slice(0,i)]=decodeURIComponent(kv.slice(i+1));});
  if(!o.open&&!o.task)return;
  try{history.replaceState(null,"",location.pathname+location.search);}catch(e){}
  if(o.open&&findP(o.open))gotoTask(o.open,"tasks",o.task||null);
  else{view="queue";render();if(o.task)setTimeout(function(){var te=el("task-"+o.task);if(te){te.scrollIntoView({behavior:"smooth",block:"center"});te.classList.add("tflash");}},150);}
}

  if(!t)return;

function impCommit(){
  var c=impCtx.c,msg=document.getElementById("impMsg2"),btn=document.getElementById("impGo");
  var stamp=new Date().toISOString().slice(0,10),ups=[],adds=c.add.slice(),used={},err=null;
  document.querySelectorAll("[data-impother]").forEach(function(x){if(x.checked)adds.push(c.addOther[+x.dataset.impother]);});
  document.querySelectorAll("[data-impfill]").forEach(function(x){var f=c.fill[+x.dataset.impfill];
    if(x.value==="fill"&&f.patch)ups.push({id:f.p.order_no,patch:f.patch});
    if(x.value==="repl")ups.push({id:f.p.order_no,patch:f.repl.patch,old:f.repl.old});});
  document.querySelectorAll("[data-impch]").forEach(function(s){
    var x=c.choose[+s.dataset.impch],v=s.value;if(!v)return;
    if(v==="__new"){x.o.__key=x.key;adds.push(x.o);return;}
    if(used[v]){err="הפרויקט "+v+" נבחר ליותר משורה אחת";return;}
    used[v]=1;var p=findP(v),pt=p?impPatch(p,x.o):null;
    if(pt){ups=ups.filter(function(u){return u.id!==v;});ups.push({id:v,patch:pt});}
  });
  if(err){msg.innerHTML='<span style="color:#A33228">'+esc(err)+'</span>';return;}
  if(!ups.length&&!adds.length){msg.textContent="לא נבחר שום שינוי.";return;}
  btn.disabled=true;
  var recs=adds.map(function(o){return impBuildRecord(o,stamp,me.id);});
  var added=0,updated=0,p=Promise.resolve();
  for(var i=0;i<recs.length;i+=50)(function(chunk){p=p.then(function(){return sb.from("projects").insert(chunk).then(function(r){if(r.error)throw r.error;added+=chunk.length;msg.textContent="נוספו "+added+" מתוך "+recs.length+"…";});});})(recs.slice(i,i+50));
  ups.forEach(function(u){p=p.then(function(){var patch=Object.assign({},u.patch,{updated_at:new Date().toISOString(),updated_by:me.id});return sb.from("projects").update(patch).eq("order_no",u.id).then(function(r){if(r.error)throw r.error;updated++;msg.textContent="עודכנו "+updated+" מתוך "+ups.length+"…";
      if(u.old){var sm="עדכון מאקסל ("+impCtx.file+"). ערכים קודמים: "+Object.keys(u.old).map(function(k){return (IMP_FILL_L[k]||(k==="state"?"מצב":k))+": "+(u.old[k]||"ריק");}).join(" · ");
        return sb.from("project_log").insert({order_no:u.id,log_date:today(),direction:"in",contact:"ייבוא אקסל",summary:sm,created_by:me.id}).then(function(){});}
    });});});
  p.then(function(){
    var val=impCtx.removedRaw,list=Array.isArray(val)?val.slice():(val&&Array.isArray(val.items)?val.items.slice():null);
    if(c.frozenNew.length&&list){
      c.frozenNew.forEach(function(x){list.push({order_no:x.o.order_no||("PV"+(impPVs(x.o.pv_order)[0]||"")),state:x.st});});
      var nv=Array.isArray(val)?list:Object.assign({},val,{items:list});
      return sb.from("meta").upsert({key:"removed",value:nv}).then(function(){},function(){});
    }
  }).then(function(){
    var old=meta||{};
    return sb.from("meta").upsert({key:"import",value:Object.assign({},old,{last_import:stamp,file:impCtx.file,rows:impCtx.rows,loaded:(old.loaded||0)+added,filled:updated})}).then(function(){},function(){});
  }).then(function(){return Promise.all([loadProjects(),loadMeta()]);}).then(function(){
    if(added){fState="all";fMstatus="all";fPtype="all";fStage="all";shown=PAGE;qText=(recs.length===1?String(recs[0].order_no):"");}
    render();impClose();toast("נוספו "+added+" · הושלמו נתונים ב-"+updated+(added?" · המסננים נוקו כדי שהחדשים יוצגו":""));
    if(recs.length===1)gotoTask(recs[0].order_no,"info");
  }).catch(function(e){
    btn.disabled=false;msg.innerHTML='<span style="color:#A33228">שגיאה: '+esc(String(e&&e.message||e))+' (נוספו '+added+', עודכנו '+updated+' לפני השגיאה)</span>';
  });
}

function renderTiles(){
  if(view==="users")return;
  var act=0,soon=0,over=0,miss=0,wait=0,froz=0,lic=0;
  projects.forEach(function(p){var s=stateOf(p);if(s==="frozen")froz++;if(s!=="active")return;act++;var psl=projStatus(p).l;if(psl==="בתהליך"||psl==="תקוע")lic++;var d=daysTo(p.next_date);if(d!=null&&d>=0&&d<=30)soon++;if(d!=null&&d<0&&!complete(p))over++;miss+=missing(p);});
  tasks.forEach(function(t){if(t.status!=="done")wait++;});
  var T=el("tiles"); if(!T)return;
  T.innerHTML=tile("פעילים",act)+tile("בתהליך רישוי",lic)+tile("דיון ב-30 יום",soon)+tile("תאריכים שעברו",over,over?"bad":"")+tile("מסמכים חסרים",miss,miss?"warn":"")+tile("משימות ממתינות",wait,wait?"warn":"")+tile("מוקפאים",froz);
}

function matches(p){
  if(fState!=="all"&&stateOf(p)!==fState)return false;

  if(qText){var hay=[p.name,p.developer,p.client_no,p.order_no,p.pv_order,p.address,p.gush,p.helka,p.committee,p.agent,p.details].join(" ").toLowerCase();if(hay.indexOf(qText.toLowerCase())<0)return false;}
  return true;
}
function sortProjects(arr){
  if(!fSort)return arr;
  var field=/^pv/.test(fSort)?"pv_received_at":"sync_due";
  var dir=/_desc$/.test(fSort)?-1:1;
  return arr.slice().sort(function(a,b){
    var da=dnum(a[field]),db=dnum(b[field]);
    var na=isNaN(da),nb=isNaN(db);
    if(na&&nb)return 0; if(na)return 1; if(nb)return -1; // ריקים תמיד בסוף
    return (da-db)*dir;
  });
}

function uploadFiles(id,fileList){
  if(!fileList||!fileList.length)return;
  var files=[].slice.call(fileList),done=0;
  var msg=document.querySelector('[data-uplmsg="'+CSS.escape(id)+'"]');
  var folder=String(id).replace(/[^\w\-]/g,"_");
  function step(){
    if(!files.length){if(msg)msg.textContent="";toast(done?("הועלו "+done+" קבצים"):"לא הועלה דבר");loadFiles(id);return;}
    var f=files.shift();
    if(f.size>52428800){toast('הקובץ "'+f.name+'" גדול מ-50MB — דולג');step();return;}
    if(msg)msg.textContent="מעלה "+f.name+"…";
    var ext=(f.name.match(/\.[a-zA-Z0-9]+$/)||[""])[0];
    var ctype=f.type||(/\.html?$/i.test(f.name)?"text/html":(/\.pdf$/i.test(f.name)?"application/pdf":"application/octet-stream"));
    var path=folder+"/"+Date.now()+"-"+Math.random().toString(36).slice(2,8)+ext;
    sb.storage.from("permito-files").upload(path,f,{contentType:ctype,upsert:false}).then(function(up){
      if(up.error){toast("שגיאת העלאה: "+up.error.message);step();return;}
      sb.from("project_files").insert({order_no:id,name:f.name,path:path,mime:ctype,size:f.size}).then(function(ins){
        if(ins.error){toast("שמירת רשומה נכשלה: "+ins.error.message);sb.storage.from("permito-files").remove([path]);}
        else done++;
        step();
      });
    });
  }
  step();
}

  if(canWrite()&&t.status!=="done")h+='<button class="copybtn" data-done="'+esc(t.id)+'">סמן בוצע</button>';
  if(canWrite())h+='<button class="copybtn danger" data-delt="'+esc(t.id)+'">מחק</button>';
  h+='</div><div class="req">'+esc(t.request)+'</div>';
  if(t.answer)h+='<div class="answer"><em>תשובה'+(t.done_at?' · '+esc(fmtDate(t.done_at)):'')+'</em>'+esc(t.answer)+'</div>';
  if(canWrite()&&t.status!=="done"&&(t.kind==="nadav"||t.kind==="nadav_update"))h+='<div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap"><input id="tans-'+esc(t.id)+'" placeholder="עדכון לנדב" style="flex:1;min-width:180px"><button class="copybtn" data-tans="'+esc(t.id)+'">שלח עדכון</button></div>';
  return h+'</article>';
}

/* ---------- detail bindings ---------- */
function bindDetail(){
  document.querySelectorAll("[data-tab]").forEach(function(b){b.onclick=function(){tab=b.dataset.tab;render();bindProjects();};});
  document.querySelectorAll("[data-st]").forEach(function(e){e.onchange=function(){saveStage(e.dataset.pid,e.dataset.st,e.dataset.f,e.value);};});
  document.querySelectorAll("[data-doc]").forEach(function(e){e.onchange=function(){saveDoc(e.dataset.pid,e.dataset.doc,e.dataset.f,e.value);};});
  document.querySelectorAll("[data-pf]").forEach(function(e){e.onchange=function(){var patch={};patch[e.dataset.pf]=(e.value===""?null:e.value);touchAndUpdate(e.dataset.pid,patch);};});
  document.querySelectorAll("[data-upl]").forEach(function(inp){inp.onchange=function(){uploadFiles(inp.dataset.upl,inp.files);inp.value="";};});
  document.querySelectorAll("[data-fopen]").forEach(function(b){b.onclick=function(){openFile(b.dataset.pid,b.dataset.fopen);};});
  document.querySelectorAll("[data-delf]").forEach(function(b){b.onclick=function(){
    if(b.getAttribute("data-confirm")){delFile(b.dataset.pid,b.dataset.delf,b.dataset.path);}
    else{b.setAttribute("data-confirm","1");b.textContent="בטוח? מחק";setTimeout(function(){b.removeAttribute("data-confirm");b.textContent="מחק";},2500);}
  };});
  document.querySelectorAll("[data-tech]").forEach(function(e){e.onchange=function(){saveTech(e.dataset.pid,e.dataset.tech,e.value);};});
  document.querySelectorAll("[data-proc]").forEach(function(e){e.onchange=function(){saveProc(e.dataset.pid,e.dataset.proc,e.dataset.pk,e.value);};});
  document.querySelectorAll("[data-fin]").forEach(function(e){e.onchange=function(){saveFinance(e.dataset.pid,e.dataset.fin,e.value);};});
  document.querySelectorAll("[data-copy]").forEach(function(b){b.onclick=function(){var t=b.dataset.copy;if(navigator.clipboard)navigator.clipboard.writeText(t).then(function(){toast("הועתק");}).catch(function(){toast(t);});else toast(t);};});
  document.querySelectorAll("[data-del]").forEach(function(b){b.onclick=function(){if(b.dataset.confirm){sb.from("projects").delete().eq("order_no",b.dataset.del).then(function(r){if(r.error){toast(r.error.message);return;}openId=null;projects=projects.filter(function(p){return p.order_no!==b.dataset.del;});toast("נמחק");render();});}else{b.dataset.confirm="1";b.textContent="לחץ שוב למחיקה סופית";}};});
  document.querySelectorAll("[data-delc]").forEach(function(b){b.onclick=function(){var p=findP(b.dataset.pid);if(!p)return;var c=JSON.parse(JSON.stringify(p.contacts||{}));delete c[b.dataset.delc];p.contacts=c;touchAndUpdate(b.dataset.pid,{contacts:c}).then(function(){render();bindProjects();});};});
  document.querySelectorAll("[data-addc]").forEach(function(b){b.onclick=function(){var id=b.dataset.addc,nm=(el("cn-"+id).value||"").trim();if(!nm){el("cn-"+id).focus();return;}var p=findP(id),c=JSON.parse(JSON.stringify(p.contacts||{}));c[uid("c")]={name:nm,order:contacts(p).length+1,role:(el("cr-"+id).value||"").trim(),phone:(el("cp-"+id).value||"").trim(),email:(el("ce-"+id).value||"").trim()};p.contacts=c;touchAndUpdate(id,{contacts:c}).then(function(){render();bindProjects();});};});
  document.querySelectorAll("[data-addlog]").forEach(function(b){b.onclick=function(){var id=b.dataset.addlog,s=(el("ls-"+id).value||"").trim();if(!s){el("ls-"+id).focus();return;}sb.from("project_log").insert({order_no:id,log_date:el("ld-"+id).value||today(),direction:el("ldir-"+id).value,contact:(el("lc-"+id).value||"").trim(),summary:s,created_by:me.id}).then(function(r){if(r.error){toast(r.error.message);return;}var p=findP(id);if(p)p._log=null;render();bindProjects();});};});
  document.querySelectorAll("[data-addtask]").forEach(function(b){b.onclick=function(){var id=b.dataset.addtask,r=(el("tr-"+id).value||"").trim();if(!r){el("tr-"+id).focus();return;}var p=findP(id);addTask(id,p?p.name+" · "+id:"",r);};});
  document.querySelectorAll("[data-addtaskinc]").forEach(function(b){b.onclick=function(){var id=b.dataset.addtaskinc,r=(el("tri-"+id).value||"").trim();if(!r){el("tri-"+id).focus();return;}var p=findP(id);addTask(id,p?p.name+" · "+id:"",r,"increase");};});
  document.querySelectorAll("[data-niche]").forEach(function(e){e.onchange=function(){var id=e.dataset.niche,val=e.value==="yes";touchAndUpdate(id,{niche_required:val});var bx=el("nichebox-"+id);if(bx)bx.style.display=val?"block":"none";};});
  var g=document.querySelector("[data-addtaskg]");if(g)g.onclick=function(){var r=(el("ntr").value||"").trim();if(!r){el("ntr").focus();return;}var pid=el("ntp").value||"",p=pid?findP(pid):null;addTask(pid,p?p.name+" · "+pid:"",r);};
  document.querySelectorAll("[data-ack]").forEach(function(b){b.onclick=function(){sb.from("tasks").update({status:"in_progress"}).eq("id",b.dataset.ack).then(function(r){if(r&&r.error){toast("שגיאה: "+r.error.message);return;}toast("סומן שקיבלת");loadTasks().then(render);});};});
  document.querySelectorAll("[data-tans]").forEach(function(b){b.onclick=function(){var id=b.dataset.tans,v=(el("tans-"+id).value||"").trim();if(!v){el("tans-"+id).focus();return;}var t=tasks.filter(function(x){return String(x.id)===String(id);})[0]||{};var ans=(t.answer?t.answer+"\n":"")+fmtDate(new Date().toISOString())+": "+v;sb.from("tasks").update({answer:ans,status:t.status==="pending"?"in_progress":t.status}).eq("id",id).then(function(r){if(r&&r.error){toast("שגיאה: "+r.error.message);return;}toast("העדכון נשלח");loadTasks().then(render);});};});
  document.querySelectorAll("[data-done]").forEach(function(b){b.onclick=function(){sb.from("tasks").update({status:"done",done_at:new Date().toISOString()}).eq("id",b.dataset.done).then(function(r){if(r&&r.error){toast("סימון בוצע נכשל: "+r.error.message);return;}loadTasks().then(render);});};});
  document.querySelectorAll("[data-delt]").forEach(function(b){b.onclick=function(){sb.from("tasks").delete().eq("id",b.dataset.delt).then(function(r){if(r&&r.error){toast("מחיקה נכשלה: "+r.error.message);return;}loadTasks().then(render);});};});
}
function saveFinance(id,field,val){
  var body={order_no:id}; body[field]=val===""?null:val;
  finance[id]=finance[id]||{}; finance[id][field]=val;
  sb.from("project_finance").upsert(body,{onConflict:"order_no"}).then(function(r){if(r.error)toast("שמירת מחיר נכשלה: "+r.error.message);});
}
function addTask(pid,pname,req,kind){
  sb.from("tasks").insert({order_no:pid||null,project_name:pname,request:req,status:"pending",kind:kind||"general",created_by:me.id}).then(function(r){
    if(r.error){toast(r.error.message);return;}
    toast("נוסף לתור"); loadTasks().then(render);
  });
}

/* ============================================================
   ניהול משתמשים (master)
   ============================================================ */
var users=[];
function adminCall(action,payload){
  return sb.functions.invoke("rapid-processor",{body:Object.assign({action:action},payload||{})})
   .then(function(res){ if(res.error) return {ok:false,error:(res.error.message||"function error")}; return res.data||{ok:false,error:"no response"}; })
   .catch(function(e){ return {ok:false,error:String(e&&e.message||e)}; });
}
var pendingNotice=null;
function genPw(){var c="abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789",s="";for(var i=0;i<10;i++)s+=c.charAt(Math.floor(Math.random()*c.length));return s;}
function renderUsers(){
  var b=el("body"); b.innerHTML='<div class="skel">טוען משתמשים…</div>';
  adminCall("list").then(function(r){
    var back='<div class="bar"><div class="nav"><button data-back="1">→ חזרה ללוח</button></div></div>';
    if(!r.ok){
      b.innerHTML=back+'<div class="empty"><h3>ניהול המשתמשים לא זמין</h3><p>ודא שפונקציית הניהול <span dir="ltr">permito-admin</span> נפרסה, ושאתה מחובר כמנהל.</p><p class="muted" style="font-size:12px;direction:ltr;text-align:left">'+esc(r.error||"")+'</p></div>';
      var bk=b.querySelector("[data-back]"); if(bk)bk.onclick=function(){view="projects";render();};
      return;
    }
    users=r.users||[];
    var pend=users.filter(function(u){return u.role==="pending"||u.active===false;});
    var h=back;
    if(pendingNotice){
      var pn=pendingNotice, allc='אימייל: '+pn.email+' | סיסמה זמנית: '+pn.pw+' | כתובת: rishmenergy79.github.io/permito — בכניסה הראשונה בחר סיסמה קבועה';
      h+='<div class="note" style="border:1px solid var(--accent)"><b>'+(pn.kind==="create"?"המשתמש נוצר.":"הסיסמה אופסה.")+'</b> מסור למשתמש את הפרטים — הוא יבחר סיסמה קבועה בכניסה הראשונה. הפרטים לא יוצגו שוב.'+
        '<div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">'+
        '<span>אימייל: <b class="mono">'+esc(pn.email)+'</b></span><button class="copybtn" data-copy="'+esc(pn.email)+'">העתק</button>'+
        '<span style="margin-inline-start:10px">סיסמה זמנית: <b class="mono">'+esc(pn.pw)+'</b></span><button class="copybtn" data-copy="'+esc(pn.pw)+'">העתק</button>'+
        '<button class="copybtn" data-copy="'+esc(allc)+'">העתק הכל</button>'+
        '<button class="btn btn-sm" data-clearnotice="1">סגור</button></div></div>';
    }
    h+='<div class="note"><b>אישור והרשאות.</b> משתמש חדש נכנס כ"ממתין" ולא רואה כלום עד שתשייך לו תפקיד. "עריכה" — שינוי נתונים; "צפייה" — קריאה בלבד (בלי מחירים ורווח).'+(pend.length?' יש '+pend.length+' ממתינים לאישור.':'')+'</div>';
    h+='<div class="task" style="margin-bottom:14px"><div class="sect-h"><h3>הוספת משתמש</h3></div><div class="fields">'+
       '<div class="field"><label>אימייל</label><input type="email" id="nu-email"></div>'+
       '<div class="field"><label>שם מלא</label><input type="text" id="nu-name"></div>'+
       '<div class="field"><label>סיסמה זמנית (המשתמש יחליף בכניסה)</label><div style="display:flex;gap:6px"><input type="text" id="nu-pw" style="flex:1"><button class="btn btn-sm" type="button" id="nu-gen">צור</button></div></div>'+
       '<div class="field"><label>תפקיד</label><select id="nu-role"><option value="viewer">צפייה</option><option value="editor">עריכה</option><option value="master">מנהל-על</option></select></div>'+
       '</div><p><button class="btn btn-primary btn-sm" id="nu-add">יצירת משתמש</button></p></div>';
    h+='<div class="scroll-x"><table class="tbl"><thead><tr><th>שם</th><th>אימייל</th><th>כניסה אחרונה</th><th>תפקיד</th><th>פעיל</th><th>פעולות</th></tr></thead><tbody>';
    users.forEach(function(u){
      var self=(u.id===me.id);
      h+='<tr><td>'+esc(u.full_name||"—")+'</td><td class="mono" style="font-size:12px">'+esc(u.email||"")+'</td>'+
         '<td class="mono" style="font-size:12px;white-space:nowrap">'+(u.last_sign_in?esc(fmtDate(u.last_sign_in)):"—")+'</td>'+
         '<td><select data-urole="'+esc(u.id)+'"'+(self?" disabled":"")+'>';
      ["pending","viewer","editor","master"].forEach(function(rr){h+='<option value="'+rr+'"'+(u.role===rr?" selected":"")+'>'+ROLES[rr]+'</option>';});
      h+='</select></td><td><input type="checkbox" data-uactive="'+esc(u.id)+'"'+(u.active!==false?" checked":"")+(self?" disabled":"")+'></td>'+
         '<td class="acts">'+(self?'<span class="muted" style="font-size:12px">זה אתה</span>':'<button class="copybtn" data-pw="'+esc(u.id)+'">איפוס סיסמה</button> <button class="copybtn" data-pwmail="'+esc(u.email||"")+'">שלח קישור איפוס</button> <button class="copybtn danger" data-du="'+esc(u.id)+'">מחיקה</button>')+'</td></tr>';
    });
    h+='</tbody></table></div>';
    b.innerHTML=h;
    b.querySelector("[data-back]").onclick=function(){pendingNotice=null;view="projects";render();};
    var genBtn=el("nu-gen"); if(genBtn)genBtn.onclick=function(){el("nu-pw").value=genPw();el("nu-pw").focus();};
    el("nu-add").onclick=function(){
      var email=(el("nu-email").value||"").trim(), pw=el("nu-pw").value||"", name=(el("nu-name").value||"").trim(), role=el("nu-role").value;
      if(!email||pw.length<6){toast("אימייל וסיסמה של 6 תווים לפחות");return;}
      el("nu-add").textContent="יוצר…";
      adminCall("create",{email:email,password:pw,full_name:name,role:role}).then(function(r){
        if(!r.ok){toast("יצירה נכשלה: "+r.error);el("nu-add").textContent="יצירת משתמש";return;}
        pendingNotice={kind:"create",email:email,pw:pw}; renderUsers();
      });
    };
    b.querySelectorAll("[data-copy]").forEach(function(cb){cb.onclick=function(){var t=cb.dataset.copy;if(navigator.clipboard)navigator.clipboard.writeText(t).then(function(){toast("הועתק");}).catch(function(){toast(t);});else toast(t);};});
    var cn=b.querySelector("[data-clearnotice]"); if(cn)cn.onclick=function(){pendingNotice=null;renderUsers();};
    b.querySelectorAll("[data-urole]").forEach(function(s){s.onchange=function(){adminCall("set_role",{user_id:s.dataset.urole,role:s.value}).then(function(r){toast(r.ok?"התפקיד עודכן":"שגיאה: "+r.error);});};});
    b.querySelectorAll("[data-uactive]").forEach(function(c){c.onchange=function(){adminCall("set_active",{user_id:c.dataset.uactive,active:c.checked}).then(function(r){toast(r.ok?(c.checked?"הופעל":"הושבת"):"שגיאה: "+r.error);});};});
    b.querySelectorAll("[data-pw]").forEach(function(btn){btn.onclick=function(){
      var cell=btn.closest(".acts"), uidv=btn.dataset.pw, uobj=users.filter(function(x){return x.id===uidv;})[0]||{};
      cell.innerHTML='<input type="text" style="width:120px;font-size:12px;padding:3px 6px" id="pwf-'+esc(uidv)+'"> <button class="copybtn" data-pwgen="1">צור</button> <button class="copybtn" data-pwsave="1">שמור</button> <button class="copybtn" data-pwcancel="1">בטל</button>';
      el("pwf-"+uidv).value=genPw();
      cell.querySelector("[data-pwgen]").onclick=function(){el("pwf-"+uidv).value=genPw();};
      cell.querySelector("[data-pwsave]").onclick=function(){
        var np=(el("pwf-"+uidv).value||""); if(np.length<6){toast("סיסמה של 6 תווים לפחות");return;}
        adminCall("set_password",{user_id:uidv,password:np}).then(function(r){ if(!r.ok){toast("שגיאה: "+r.error);return;} pendingNotice={kind:"reset",email:uobj.email||"",pw:np}; renderUsers();});
      };
      cell.querySelector("[data-pwcancel]").onclick=function(){renderUsers();};
    };});
    b.querySelectorAll("[data-pwmail]").forEach(function(btn){btn.onclick=function(){
      var em=btn.dataset.pwmail;if(!em){toast("למשתמש אין אימייל");return;}
      btn.textContent="שולח…";
      sb.auth.resetPasswordForEmail(em,{redirectTo:pwRedirect()}).then(function(r){btn.textContent="שלח קישור איפוס";toast(r.error?"שליחה נכשלה: "+r.error.message:"נשלח קישור איפוס אל "+em);});
    };});
    b.querySelectorAll("[data-du]").forEach(function(btn){btn.onclick=function(){
      if(btn.dataset.confirm){adminCall("delete",{user_id:btn.dataset.du}).then(function(r){toast(r.ok?"המשתמש נמחק":"שגיאה: "+r.error);renderUsers();});}
      else{btn.dataset.confirm="1";btn.textContent="לחץ שוב למחיקה";}
    };});
  });
}

/* ============================================================
   ייצוא לאקסל / CSV
   ============================================================ */
function doExport(){
  var src=projects.filter(function(p){return view==="projects"?matches(p):true;});
  if(!src.length){toast("אין נתונים לייצוא");return;}
  var rows=src.map(function(p){var cs=curStage(p),pr=progress(p);return {
    "שם לקוח":p.name||"","הזמנה":p.order_no||"","מצב":STATE_ST[stateOf(p)].l,"סטטוס במאורות":p.mstatus||"",
    "סוג מבנה":p.ptype||"","ועדה":p.committee||"","גוש":p.gush||"","חלקה":p.helka||"",
    "שלב נוכחי":cs?cs[1].label:"","שלבים":pr.done+"/"+pr.total,"מסמכים חסרים":missing(p),
    "התאריך הבא":p.next_date?fmtDate(p.next_date):"","הספק DC":p.kw||"","הערות":p.notes||""
  };});
  var keys=Object.keys(rows[0]);
  var csv="﻿"+keys.join(",")+"\r\n"+rows.map(function(r){return keys.map(function(k){var v=String(r[k]==null?"":r[k]);if(/^[=+\-@\t\r]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"';}).join(",");}).join("\r\n");
  var blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="Permito-"+today()+".csv";document.body.appendChild(a);a.click();document.body.removeChild(a);
  toast("הקובץ ירד");
}

boot();
})();
